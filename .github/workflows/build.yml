name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- Pure-Python distribution (OS-independent wheel + sdist) ----
  python-dist:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build wheel + sdist
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  # ---- One-file PyInstaller binary per OS ----
  binary:
    name: One-file binary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: pytuiplayer
          - os: macos-latest
            artifact: pytuiplayer
          - os: windows-latest
            artifact: pytuiplayer.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install mpv (build-time libmpv for PyInstaller analysis)
        # python-mpv loads the system libmpv via ctypes, so the build host must
        # have it. NOTE: the produced binary still needs libmpv on the *target*
        # machine at runtime (it is not bundled).
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)  sudo apt-get update && sudo apt-get install -y libmpv-dev ;;
            macos-latest)  brew install mpv ;;
            windows-latest) choco install mpv -y ;;
          esac

      - name: Install dependencies
        run: uv sync --dev

      - name: Build one-file binary
        run: uv run python scripts/build_pyinstaller.py

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist/${{ matrix.artifact }}

  # ---- Draft a GitHub release and attach every artifact ----
  release:
    name: Draft release
    needs: [python-dist, binary]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
